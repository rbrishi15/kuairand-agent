# Bonus benchmark (playbook Day 3: "if time remains, attempt KuaiRand-1K
# with the same pipeline"). Separate file rather than editing
# kuairand_1k.yaml directly, same convention as
# kuairand_pure_deepfm_mtl.yaml (Min's local test config) — points
# model.name at deepfm_mtl instead of fm, same fixed seed/split.
#
# checkpoint_dir is deliberately its own directory (checkpoints_1k, not
# checkpoints/): train.py names checkpoints by variant+seed only, not by
# dataset, so a plain deepfm_mtl seed0 run here would silently overwrite
# checkpoints/deepfm_mtl_seed0.pt (the real KuaiRand-Pure result) if left
# pointed at the same directory.
dataset: kuairand_1k
data_dir: data/raw_1k
seed: 0

splits:
  train: [20220408, 20220421]
  valid: [20220422, 20220428]
  test:  [20220429, 20220508]

model:
  name: deepfm_mtl
  embed_dim: 16
  lr: 0.001
  bs: 8192
  epochs: 40
  patience: 4

convergence:
  epsilon: 0.002
  N: 3
  max_iterations: 50
  max_wallclock_hours: 6

checkpoint_dir: checkpoints_1k
log_path: logs/run_log.jsonl
