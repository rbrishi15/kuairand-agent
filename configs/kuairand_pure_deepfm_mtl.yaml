# [Min] Local test config for Priority 1 (DeepFMMTL) — not a new dataset,
# just kuairand_pure.yaml's fixed seed/split values (unchanged, copied
# verbatim per CLAUDE.md §0.4) with model.name pointed at deepfm_mtl
# instead of fm. Kept as a separate file rather than editing
# kuairand_pure.yaml directly, since that file is Rishi's.
dataset: kuairand_pure
data_dir: data/raw
seed: 0

splits:
  train: [20220408, 20220421]
  valid: [20220422, 20220428]
  test:  [20220429, 20220508]

model:
  name: deepfm_mtl
  embed_dim: 16
  lr: 0.001
  bs: 8192
  epochs: 40
  patience: 4

convergence:
  epsilon: 0.002
  N: 3
  max_iterations: 50
  max_wallclock_hours: 6

checkpoint_dir: checkpoints
log_path: logs/run_log.jsonl
