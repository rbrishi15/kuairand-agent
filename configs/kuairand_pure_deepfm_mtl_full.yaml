# [Rishi] Ablation config: DeepFMMTL + IPS (Vidush) + sequence encoder
# (Nandit) together — the full integrated stack. Same fixed seed/split as
# kuairand_pure.yaml (CLAUDE.md §0.4).
dataset: kuairand_pure
data_dir: data/raw
seed: 0

splits:
  train: [20220408, 20220421]
  valid: [20220422, 20220428]
  test:  [20220429, 20220508]

model:
  name: deepfm_mtl
  embed_dim: 16
  lr: 0.001
  bs: 8192
  epochs: 40
  patience: 4
  use_ips: true
  use_seq: true
  seq_max_len: 50
  seq_embed_dim: 16
  seq_hidden_dim: 32

convergence:
  epsilon: 0.002
  N: 3
  max_iterations: 50
  max_wallclock_hours: 6

checkpoint_dir: checkpoints
log_path: logs/run_log.jsonl
